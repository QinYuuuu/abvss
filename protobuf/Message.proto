syntax = "proto3";
package services;
option go_package = ".;protobuf";

service Conn {
  rpc Receive(TestHelloMessage) returns(TestResMessage){}
}

service RBC {
  rpc Receive(Message) returns(AckMsg){}
}

// The Asynchronous Batched VSS service definition
service ABVSS {
  rpc ReceiveShares(SharesMsg) returns (AckMsg){}
  rpc ReceiveLCM(LCMMsg) returns (AckMsg){}
  rpc ReconstructLCM(SKMsg) returns (AckMsg){}
  rpc ReceiveRecShares(SKMsg) returns (AckMsg) {}
}

// The one-sided voting service definition
service OSV {
  rpc Receive(OSVMsg)returns (AckMsg){}
}

message TestHelloMessage {
  int64 fromID = 1;
  int64 destID = 2;
  string content = 3;
}

message TestResMessage {
  int64 fromID = 1;
  int64 destID = 2;
  string content = 3;
}

message Message {
  int64 FromID = 1;
  int64 DestID = 2;
  int64 Index = 3;
  string Mtype = 4;
  bytes Data = 5;
}

message SharesMsg{
  int64 fromID = 1;
  int64 destID = 2;
  repeated bytes zi = 3;
  repeated bytes xi = 4;
}

message LCMMsg{
  int64 fromID = 1;
  int64 destID = 2;
  repeated bytes lcmi = 3;
}

message SKMsg{
  int64 fromID = 1;
  int64 destID = 2;
  bytes sk = 3;
}

message OSVMsg{
  int64 fromID = 1;
  int64 destID = 2;
  string mtype = 3;
}

message AckMsg{}